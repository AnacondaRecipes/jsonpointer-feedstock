{% set name = "jsonpointer" %}
{% set version = "3.8" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a627a255641390bfb4d51d4cfbb90648078ae855b45804ef7e19ea13a4cca355

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python

test:
  source_files:
    - tests.py
    - bin
    - doc
  imports:
    - jsonpointer
  requires:
    - python
    - pip
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - jsonpointer --help
    - pytest -vv tests.py doc/tutorial.rst --doctest-glob="*.rst"
    - python -c "import doctest, jsonpointer; r = doctest.testmod(jsonpointer); assert not r.failed, r"  # doctests in the installed jsonpointer.py (upstream runs them via tests.py load_tests)

about:
  home: https://github.com/stefankoegl/python-json-pointer
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Identify specific nodes in a JSON document (RFC 6901)
  description: Library to resolve JSON Pointers according to RFC 6901
  dev_url: https://github.com/stefankoegl/python-json-pointer/tree/v{{ version }}
  doc_url: https://python-json-pointer.readthedocs.io

extra:
  recipe-maintainers:
    - anguslees
    - pmlandwehr
