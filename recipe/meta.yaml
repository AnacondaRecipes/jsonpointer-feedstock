{% set name = "jsonpointer" %}
{% set version = "3.6" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 82e839a3ba3a9e2b54394fda8b3d276c2459d80408d06ef9a6fbc369d7544ffc

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python

test:
  source_files:
    - tests.py
    - bin
  imports:
    - jsonpointer
  requires:
    - python
    - pip
    - pytest
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - jsonpointer --help
    - pytest -vv tests.py

about:
  home: https://github.com/stefankoegl/python-json-pointer
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Identify specific nodes in a JSON document (RFC 6901)
  description: Library to resolve JSON Pointers according to RFC 6901
  dev_url: https://github.com/stefankoegl/python-json-pointer/tree/v{{ version }}
  doc_url: https://python-json-pointer.readthedocs.io

extra:
  recipe-maintainers:
    - anguslees
    - pmlandwehr
